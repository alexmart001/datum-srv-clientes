server:
  port: 8080
spring:
  application:
    name: datum-srv-clientes
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/datum_db?useTimezone=true&serverTimezone=UTC
    username: user_datum
    password: C0ntrol3Xyz21
  devtools:
    add-properties: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
